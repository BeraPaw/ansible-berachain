---
# Init and Configure Bera-reth

- name: Retrieve latest eth-genesis.json
  become: true
  ansible.builtin.get_url:
    url: "{{ execution_genesis }}"
    dest: "{{ folder }}/{{ execution_container_name }}/eth-genesis.json"
    mode: "0644"
    force: true
    checksum: md5:{{ execution_genesis_md5sum }}
  register: genesis_changed

- name: Identify if execution is initialized
  ansible.builtin.stat:
    path: "{{ folder }}/{{ execution_container_name }}/reth.toml"
  register: execution_initialized

- name: Initialize berachain execution node
  when: not execution_initialized.stat.exists
  block:
    - name: Init berachain execution container
      community.docker.docker_container:
        name: "{{ execution_container_name }}-init"
        image: ghcr.io/berachain/bera-reth:{{ execution_container_version }}
        state: started
        pull: true
        detach: false
        auto_remove: true
        cleanup: true
        volumes:
          - "{{ folder }}/{{ execution_container_name }}:/data"
        command: init --datadir=/data --chain=/data/eth-genesis.json

- name: Download EL peers from source
  ansible.builtin.uri:
    url: "{{ execution_bootnodes }}"
    status_code: 200
    return_content: true
  register: el_bootnodes

- name: Format EL bootnodes if multiline
  ansible.builtin.set_fact:
    el_bootnodes_formatted: "{{ el_bootnodes.content | trim | replace('\n', ',') }}"

- name: Format EL trusted nodes if provided
  ansible.builtin.set_fact:
    el_trusted_nodes_list: "{{ execution_trusted_nodes | trim | replace('\n', ',') | split(',') | map('trim') | reject('equalto', '') | list }}"
  when: execution_trusted_nodes | default('') | length > 0

- name: Join EL trusted nodes for client flags
  ansible.builtin.set_fact:
    el_trusted_nodes_formatted: "{{ el_trusted_nodes_list | join(',') }}"
  when: el_trusted_nodes_list is defined and el_trusted_nodes_list | length > 0

- name: Run bera-reth execution container
  community.docker.docker_container:
    name: "{{ execution_container_name }}"
    image: "ghcr.io/berachain/bera-reth:{{ execution_container_version }}"
    restart_policy: unless-stopped
    state: started
    pull: true
    stop_timeout: 600
    networks:
      - name: "{{ network }}_net"
    ports:
      # p2p
      - "30303:30303/tcp"
      - "30303:30303/udp"
      # rpc (add additional lines for local network access if necessary)
      - 127.0.0.1:{{ custom_port_prefix }}45:8545
      - 127.0.0.1:{{ custom_port_prefix }}46:8546
    volumes:
      - "{{ folder }}/{{ execution_container_name }}:/data"
      - "{{ folder }}/jwtsecret:/jwtsecret:ro"
      - /etc/localtime:/etc/localtime:ro
    command:
      - node
      - --datadir=/data
      - --config=/data/reth.toml
      - --port=30303
      - --discovery.port=30303
      - --nat=extip:{{ public_ip.content | trim }}
      - --chain=/data/eth-genesis.json
      - --bootnodes=enode://2ec46b2e63d8b2dded191fd55695af9f653a0cc1d5ac40cc3047585eda6e03ae27ccb98d282856c232b3737531e55516af680b36debc5aa94e1f65a29e4eacda@37.27.231.195:59831
      # - --trusted-peers={{ el_bootnodes_formatted }}
      # - --log.stdout.filter={{ execution_log_filter }}
      # - --log.file.filter={{ execution_log_filter }}
      # RPC & ws
      - --http
      - --http.addr=0.0.0.0
      - --http.port=8545
      - --http.corsdomain=*
      - --http.api=eth,net,web3,debug,trace,admin
      - --ws
      - --ws.addr=0.0.0.0
      - --ws.port=8546
      - --ws.origins=*
      - --ws.api=eth,net,web3,debug,trace,admin
      # Auth to beacond
      - --authrpc.addr=0.0.0.0
      - --authrpc.port=8551
      - --authrpc.jwtsecret=/jwtsecret
      # Metrics
      - --metrics=0.0.0.0:6060
      # Necessary for beacond
      - --engine.persistence-threshold=0
      - --engine.memory-block-buffer-target=0
      # MEV Stuff
      - --rpc.txfeecap=0
      - --txpool.pricebump=1
      - --txpool.max-pending-txns=200000
      - --txpool.max-new-txns=50000
      - --txpool.max-account-slots=128
      - --max-inbound-peers=200
      - --max-outbound-peers=200
  register: execution_container
